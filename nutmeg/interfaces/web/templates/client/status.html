{% extends "client/layout.html" %}
{% block content %}
<main class="client-shell">
  <section class="hero-panel">
    <p class="eyebrow">Client status</p>
    <h1>数据状态</h1>
    <p class="responsible-use">{{ responsible_use }}</p>
  </section>
  <article class="match-card">
    <h2>用户 / 权限</h2>
    <p>user={{ status.user_id }}</p>
    <p>plan={{ status.entitlements.plan }}</p>
    <p>premium={{ status.entitlements.premium_match_detail_enabled }}</p>
  </article>
  <article class="match-card">
    <h2>数据健康</h2>
    <p>health={{ status.health.health }}</p>
  </article>
</main>
{% endblock %}

{% extends "decision/layout.html" %}
{% block body %}
<link rel="stylesheet" href="/static/decision/issue.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/decision/shell.css?v={{ asset_v }}">
{% set nav_active = "issue" %}{% include "decision/_nav.html" %}
<main id="issue" data-issue="{{ issue }}" class="issue">
  <header class="issue-head"><h1>{{ issue }} 决策表</h1><p id="brake" class="brake"></p></header>
  <p id="errors" class="errors" hidden></p>
  <div class="issue-grid">
    <section class="board" aria-label="决策表"><p id="seen" class="seen" hidden></p><div id="table" role="table"></div></section>
    <aside class="side"><div id="draft"></div><div id="review"></div><div id="actions"></div></aside>
  </div>
  <section id="bridge" class="bridge" aria-labelledby="bridge-h" hidden></section>
  <section id="slip500" class="bridge slip500" aria-labelledby="slip500-h" hidden></section>
</main>
<script src="/static/decision/issue.js?v={{ asset_v }}"></script>
{% endblock %}

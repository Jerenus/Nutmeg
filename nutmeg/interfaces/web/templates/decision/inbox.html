{% extends "decision/layout.html" %}
{% block body %}
<link rel="stylesheet" href="/static/decision/inbox.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/decision/shell.css?v={{ asset_v }}">
{% set nav_active = "inbox" %}{% include "decision/_nav.html" %}
<main id="inbox" class="ib">
  <header class="ib-head">
    <h1>待签</h1>

<script src="/static/decision/inbox.js?v={{ asset_v }}"></script>
{% endblock %}

{% extends "decision/layout.html" %}
{% block body %}
<link rel="stylesheet" href="/static/decision/jczq.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/decision/shell.css?v={{ asset_v }}">
{% set nav_active = "jczq" %}{% include "decision/_nav.html" %}
<main id="jczq" data-day="{{ day }}" class="jczq">
  <header class="jczq-head"><h1>竞彩 {{ day }}</h1><p id="brake" class="brake"></p></header>
  <p id="errors" class="errors" hidden></p>
  <div class="jczq-grid">
    <section class="board" aria-label="板面"><div id="table" role="table"></div></section>
    <aside class="side" aria-label="我的串"><div id="slip"></div><div id="review"></div><div id="actions"></div></aside>
  </div>
</main>
<script src="/static/decision/jczq.js?v={{ asset_v }}"></script>
{% endblock %}

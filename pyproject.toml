[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nutmeg"
version = "0.2.0"
description = "CLI-first football analysis agent foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jun Zheng" }]
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langsmith>=0.4,<1",
  "pandas>=3.0.2",
  "pydantic-settings>=2.8,<3",
  "PyYAML>=6.0,<7",
  "reportlab>=4,<5",
  "rich>=14.0,<15",
  "soccerdata>=1.9.0",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ai = [
  "langgraph>=0.4,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
nutmeg = "nutmeg.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nutmeg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

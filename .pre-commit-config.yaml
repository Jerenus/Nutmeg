# 本地交付质量门（repo 无 remote，CI 只是备而不用——这里才是真正的守门人）
# 安装: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (staged files)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: pytest-touched-decision
        name: pytest (decision ontology subset when touched)
        entry: bash -c 'uv run pytest tests/decision/ -q'
        language: system
        files: ^nutmeg/decision/
        pass_filenames: false
